services:
  postgres:
    image: postgres:17
    ports:
      - '5666:5432'
    environment:
      POSTGRES_USER: cro
      POSTGRES_PASSWORD: cro_dev_password
      POSTGRES_DB: cro_grammar
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  # Grafana with Prometheus (metrics), Tempo (traces), Loki (logs) and an
  # OpenTelemetry Collector in one container, for local development only.
  otel-lgtm:
    image: grafana/otel-lgtm:0.41.0
    ports:
      # Grafana. Port 3000 belongs to the API.
      - '127.0.0.1:3001:3000'
      # OTLP over HTTP: the API sends traces and metrics here.
      - '127.0.0.1:4318:4318'
    volumes:
      - lgtm-data:/data
      # Lists new traces in Grafana's search after about 5 s instead of 30 s.
      - ./docker/otel-lgtm/tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro

volumes:
  pgdata:
  lgtm-data:
