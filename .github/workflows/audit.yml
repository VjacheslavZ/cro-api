name: Security audit

on:
  schedule:
    - cron: '17 6 * * *' # daily at 06:17 UTC, off the hour to avoid peak load
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Needs only package-lock.json, so there is no npm ci step.
      - run: npm audit --audit-level=high --omit=dev
