name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails on high/critical vulnerabilities in production dependencies.
      # devDependencies are excluded (--omit=dev) since they never ship to users.
      - name: Security audit (npm)
        run: npm audit --audit-level=high --omit=dev

      - run: npm run prisma:generate

      - run: npx turbo run lint typecheck --continue

      - run: npx turbo run test:coverage --continue

      - run: npx turbo run build --continue
