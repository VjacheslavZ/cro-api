<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Быстрый тест</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563eb}a:hover{color:#1d4ed8}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 904px; background: #ffffff; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #0f172a">
<dc-import name="Header" variant="auth" hint-size="100%,64px"></dc-import>
<main style="flex: 1 1 auto; min-height: 640px">
<div style="max-width: 600px; margin: 0 auto; box-sizing: border-box; padding: 32px 24px">
<div style="margin-bottom: 32px; padding: 16px; border: 1px solid #e5e5e5; border-radius: 14px; background: #ffffff; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06)">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px">
<a href="Vocabulary.dc.html" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px 0 6px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #0f172a; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Стоп</a>
<span style="font-size: 14px; font-weight: 500; color: #737373; font-variant-numeric: tabular-nums">4 / 12</span>
</div>
<div style="height: 8px; border-radius: 999px; background: rgba(15, 23, 42, 0.1)"><div style="width: 33%; height: 8px; border-radius: 999px; background: #0f172a"></div></div>
</div>
<div style="padding: 24px; border: 1px solid #e5e5e5; border-radius: 14px; background: #ffffff">
<div style="display: flex; justify-content: center; margin-bottom: 16px">
<span style="font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; color: #0f172a">5</span>
</div>
<div style="margin-bottom: 24px; text-align: center">
<p style="margin: 0 0 4px; font-size: 14px; color: #737373">Составьте хорватское слово:</p>
<p style="margin: 0; font-size: 30px; font-weight: 700">jabuka</p>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{ o.pick }}" style="display: flex; align-items: center; width: 100%; height: 48px; padding: 0 14px; box-sizing: border-box; border: 1px solid {{ o.border }}; border-radius: 10px; background: {{ o.bg }}; font: inherit; font-size: 16px; text-align: left; color: {{ o.color }}">{{ o.label }}</button>
</sc-for>
</div>
</div>
</div>
</main>
<dc-import name="Footer" hint-size="100%,200px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":904}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: null };
}
renderVals() {
const self = this;
const correct = 'яблоко';
const picked = this.state.picked;
const options = ['груша', 'яблоко', 'слива', 'апельсин'].map(function (label) {
let border = '#e5e5e5', bg = '#ffffff', color = '#0f172a';
if (picked !== null && label === correct) { border = '#16a34a'; bg = '#dcfce7'; color = '#166534'; }
else if (picked === label) { border = '#fca5a5'; bg = '#fee2e2'; color = '#991b1b'; }
return { label: label, border: border, bg: bg, color: color, pick: function () { if (self.state.picked === null) self.setState({ picked: label }); } };
});
return { options: options };
}
}
</script>
</body>
</html>
