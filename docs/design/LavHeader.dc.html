<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Header — вариант «Лаванда»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:1px solid #4E3F7A;outline-offset:4px}
</style>
</helmet>
<header style="width: 100%; min-height: 80px; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 0 48px; background: #F5F3F8; border-bottom: 1px solid #E4DFEB; font-family: 'Jost', ui-sans-serif, system-ui, sans-serif; color: #251E33">
<div style="display: flex; align-items: center; gap: 36px; flex-wrap: wrap">
<sc-if value="{{ isAuth }}" hint-placeholder-val="{{ true }}">
<nav aria-label="Основная навигация" style="display: flex; gap: 36px; flex-wrap: wrap">
<a href="LavGrammar.dc.html" style="padding: 4px 0; border-bottom: 1px solid {{ exUnderline }}; font-size: 15px; font-weight: 400; color: #251E33; text-decoration: none">Упражнения</a>
<a href="MyDictionary.dc.html" style="padding: 4px 0; font-size: 15px; font-weight: 400; color: #251E33; text-decoration: none">Словарь</a>
<a href="Lessons.dc.html" style="padding: 4px 0; font-size: 15px; font-weight: 400; color: #251E33; text-decoration: none">Уроки</a>
</nav>
</sc-if>
</div>
<a href="LavHome.dc.html" style="font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 28px; font-weight: 400; font-style: italic; letter-spacing: 0.01em; color: #251E33; text-decoration: none">CroGrammar</a>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 24px">
<sc-if value="{{ isAuth }}" hint-placeholder-val="{{ true }}">
<span title="Всего XP" style="font-size: 14px; color: #6B6478"><span style="font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 18px; color: #8A6F43">[XP]</span> XP</span>
<span title="Дней подряд" style="font-size: 14px; color: #6B6478"><span style="font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 18px; color: #8A6F43">[дни]</span> дней подряд</span>
<button type="button" aria-label="Меню пользователя" style="width: 40px; height: 40px; border: 1px solid #CFC7DB; border-radius: 999px; background: transparent; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 18px; font-style: italic; color: #4E3F7A">V</button>
</sc-if>
<sc-if value="{{ isGuest }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Тема" style="padding: 4px 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: #251E33">Светлая тема</button>
<button type="button" aria-label="Язык интерфейса" style="padding: 4px 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: #251E33">Русский</button>
</sc-if>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["auth","guest"],"default":"auth"},"active":{"editor":"enum","options":["none","exercises"],"default":"none"},"$preview":{"width":1440,"height":80}}'>
class Component extends DCLogic {
renderVals() {
const variant = this.props.variant ?? 'auth';
const active = this.props.active ?? 'none';
return { isAuth: variant !== 'guest', isGuest: variant === 'guest', exUnderline: active === 'exercises' ? '#8A6F43' : 'transparent' };
}
}
</script>
</body>
</html>
