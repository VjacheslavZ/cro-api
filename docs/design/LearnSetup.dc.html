<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Учить слова — настройка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563eb}a:hover{color:#1d4ed8}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 864px; background: #ffffff; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #0f172a">
<dc-import name="Header" variant="auth" hint-size="100%,64px"></dc-import>
<main style="flex: 1 1 auto; min-height: 600px">
<div style="max-width: 600px; margin: 0 auto; box-sizing: border-box; padding: 32px 24px">
<a href="Vocabulary.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; margin-bottom: 16px; padding: 0 10px 0 8px; border-radius: 8px; font-size: 14px; font-weight: 500; color: #0f172a; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Словарный запас</a>
<h1 style="margin: 0 0 8px; font-size: 30px; font-weight: 600">Учить слова</h1>
<h2 style="margin: 24px 0 8px; font-size: 16px; font-weight: 600">Слов за сессию</h2>
<div role="group" aria-label="Слов за сессию" style="display: flex; flex-wrap: wrap">
<sc-for list="{{ counts }}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" style="min-width: 56px; height: 36px; margin-right: -1px; padding: 0 12px; border: 1px solid #e5e5e5; background: {{ c.bg }}; font: inherit; font-size: 14px; font-weight: 500; color: #0f172a">{{ c.label }}</button>
</sc-for>
</div>
<h2 style="margin: 24px 0 8px; font-size: 16px; font-weight: 600">Выбор слов</h2>
<div role="group" aria-label="Выбор слов" style="display: flex; flex-wrap: wrap">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
<button type="button" aria-pressed="{{ f.pressed }}" onClick="{{ f.pick }}" style="height: 36px; margin-right: -1px; padding: 0 14px; border: 1px solid #e5e5e5; background: {{ f.bg }}; font: inherit; font-size: 14px; font-weight: 500; color: #0f172a">{{ f.label }}</button>
</sc-for>
</div>
<div style="margin-top: 32px">
<a href="LearnPreview.dc.html" style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 10px; background: #2563eb; font-size: 14px; font-weight: 500; color: #ffffff; text-decoration: none">Далее</a>
</div>
</div>
</main>
<dc-import name="Footer" hint-size="100%,200px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":864}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { count: '10', filter: 'newest' };
}
renderVals() {
const self = this;
const counts = ['5', '10', '15', '20'].map(function (n) {
const on = self.state.count === n;
return { label: n, pressed: on ? 'true' : 'false', bg: on ? '#f5f5f5' : '#ffffff', pick: function () { self.setState({ count: n }); } };
});
const filterDefs = [['newest', 'Новые'], ['oldest', 'Старые'], ['progress', 'По прогрессу (0%→100%)']];
const filters = filterDefs.map(function (d) {
const on = self.state.filter === d[0];
return { label: d[1], pressed: on ? 'true' : 'false', bg: on ? '#f5f5f5' : '#ffffff', pick: function () { self.setState({ filter: d[0] }); } };
});
return { counts: counts, filters: filters };
}
}
</script>
</body>
</html>
