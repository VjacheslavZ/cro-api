<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Учить слова — упражнение 1: составить слово</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563eb}a:hover{color:#1d4ed8}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 980px; background: #ffffff; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #0f172a">
<dc-import name="Header" variant="auth" hint-size="100%,64px"></dc-import>
<main style="flex: 1 1 auto; min-height: 716px">
<div style="max-width: 600px; margin: 0 auto; box-sizing: border-box; padding: 32px 24px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px">
<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #2563eb; font-size: 12px; font-weight: 500; color: #ffffff">1</span>
<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 20px; padding: 0 6px; box-sizing: border-box; border: 1px solid #e5e5e5; border-radius: 999px; font-size: 12px; font-weight: 500; color: #0f172a">2</span>
<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 20px; padding: 0 6px; box-sizing: border-box; border: 1px solid #e5e5e5; border-radius: 999px; font-size: 12px; font-weight: 500; color: #0f172a">3</span>
<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 20px; padding: 0 6px; box-sizing: border-box; border: 1px solid #e5e5e5; border-radius: 999px; font-size: 12px; font-weight: 500; color: #0f172a">4</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #737373">
<span>Упражнение 1 из 4</span>
<span>Вопрос 1 из 5</span>
</div>
<div role="progressbar" aria-label="Вопрос 1 из 5" style="height: 8px; margin-bottom: 24px; border-radius: 999px; background: #e5e5e5"><div style="width: 20%; height: 8px; border-radius: 999px; background: #2563eb"></div></div>
<div style="padding: 40px; border-radius: 18px; background: #ffffff; box-shadow: {{ ring }}">
<div style="margin-bottom: 32px; text-align: center">
<p style="margin: 0 0 8px; font-size: 14px; color: #737373">Составьте хорватское слово:</p>
<p style="margin: 0; font-size: 30px; font-weight: 700">хлеб</p>
</div>
<div aria-label="Составленное слово" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; min-height: 64px; margin-bottom: 32px">
<sc-for list="{{ slots }}" as="s" hint-placeholder-count="4">
<div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; box-sizing: border-box; border: 2px solid {{ s.border }}; border-radius: 10px; background: {{ s.bg }}; font-size: 18px; font-weight: 700; color: {{ s.color }}">{{ s.char }}</div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 16px">
<sc-for list="{{ tiles }}" as="t" hint-placeholder-count="8">
<button type="button" aria-label="{{ t.label }}" onClick="{{ t.pick }}" disabled="{{ t.disabled }}" style="width: 52px; height: 52px; box-sizing: border-box; border: 1px solid {{ t.border }}; border-radius: 10px; background: #ffffff; font: inherit; font-size: 18px; font-weight: 700; color: {{ t.color }}; visibility: {{ t.visibility }}">{{ t.char }}</button>
</sc-for>
</div>
<sc-if value="{{ showReset }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: center; margin-bottom: 8px">
<button type="button" onClick="{{ reset }}" style="height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 13px; font-weight: 500; color: #737373">Сбросить</button>
</div>
</sc-if>
<div style="display: flex; align-items: center; justify-content: center; min-height: 64px; margin-bottom: 16px">
<sc-if value="{{ perfect }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-start; gap: 8px; color: #16a34a"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 28px; margin-top: 2px"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span style="font-size: 18px; font-weight: 600">Отлично! Без ошибок!</span></div>
</sc-if>
<sc-if value="{{ withErrors }}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; align-items: flex-start; gap: 8px; color: #b45309"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 28px; margin-top: 2px"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg><span style="margin-top: 4px; font-size: 16px; font-weight: 500">Завершено с ошибками</span></div>
</sc-if>
</div>
<sc-if value="{{ notComplete }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: flex-end">
<button type="button" onClick="{{ hint }}" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border: 1px solid #e5e5e5; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; font-weight: 500; color: #0f172a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>Подсказка</button>
</div>
</sc-if>
<sc-if value="{{ withErrors }}" hint-placeholder-val="{{ false }}">
<a href="LearnSession.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 56px; border-radius: 10px; background: #0f172a; font-size: 16px; font-weight: 600; color: #ffffff; text-decoration: none">Далее<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
</sc-if>
<sc-if value="{{ perfect }}" hint-placeholder-val="{{ false }}">
<a href="LearnSession.dc.html" style="display: block; text-align: center; font-size: 13px; color: #525252; text-decoration: none">Автопереход к следующему вопросу…</a>
</sc-if>
</div>
</div>
</main>
<dc-import name="Footer" hint-size="100%,200px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"initialState":{"editor":"enum","options":["idle","inProgress","perfect","withErrors"],"default":"idle"},"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const word = 'kruh';
const pool = ['u', 'm', 'k', 'a', 'h', 't', 'r', 'o'];
const init = props.initialState ?? 'idle';
const usedFor = function (n) {
const used = pool.map(function () { return false; });
for (let k = 0; k < n; k++) { const idx = pool.findIndex(function (c, j) { return c === word[k] && !used[j]; }); used[idx] = true; }
return used;
};
const n = { idle: 0, inProgress: 2, perfect: 4, withErrors: 4 }[init] ?? 0;
this.word = word;
this.pool = pool;
this.state = { placed: n, used: usedFor(n), hasError: init === 'withErrors' || init === 'inProgress', flash: -1 };
}
renderVals() {
const self = this;
const word = this.word;
const st = this.state;
const complete = st.placed === word.length;
const slots = word.split('').map(function (c, k) {
let border = '#e5e5e5', bg = 'rgba(245,245,245,0.5)', color = 'rgba(115,115,115,0.7)', ch = '_';
if (k < st.placed) {
ch = c;
if (!complete) { border = '#2563eb'; bg = '#eff6ff'; color = '#1d4ed8'; }
else if (!st.hasError) { border = '#16a34a'; bg = '#dcfce7'; color = '#166534'; }
else { border = '#d97706'; bg = '#fef3c7'; color = '#92400e'; }
}
return { char: ch, border: border, bg: bg, color: color };
});
const place = function (j, viaHint) {
const used = st.used.slice();
used[j] = true;
self.setState({ used: used, placed: st.placed + 1, hasError: st.hasError || viaHint });
};
const tiles = this.pool.map(function (c, j) {
const flashing = st.flash === j;
return {
char: c.toUpperCase(),
label: 'Буква ' + c.toUpperCase(),
visibility: st.used[j] ? 'hidden' : 'visible',
disabled: complete || st.used[j],
border: flashing ? '#dc2626' : '#e5e5e5',
color: flashing ? '#dc2626' : '#0f172a',
pick: function () {
if (complete || st.used[j]) return;
if (c === word[st.placed]) { place(j, false); return; }
self.setState({ hasError: true, flash: j });
setTimeout(function () { self.setState({ flash: -1 }); }, 500);
}
};
});
return {
slots: slots,
tiles: tiles,
ring: !complete ? '0 4px 24px rgba(0,0,0,0.10)' : (st.hasError ? '0 0 0 3px #d97706, 0 4px 24px rgba(0,0,0,0.06)' : '0 0 0 3px #16a34a, 0 4px 24px rgba(0,0,0,0.06)'),
showReset: st.placed > 0 && !complete,
notComplete: !complete,
perfect: complete && !st.hasError,
withErrors: complete && st.hasError,
reset: function () { self.setState({ placed: 0, used: self.pool.map(function () { return false; }) }); },
hint: function () {
if (complete) return;
const j = self.pool.findIndex(function (c, k) { return c === word[st.placed] && !st.used[k]; });
if (j >= 0) place(j, true);
}
};
}
}
</script>
</body>
</html>
