<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сессия упражнения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563eb}a:hover{color:#1d4ed8}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 980px; background: #ffffff; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #0f172a">
<dc-import name="Header" variant="auth" hint-size="100%,64px"></dc-import>
<main style="flex: 1 1 auto; box-sizing: border-box; padding: 48px 16px; min-height: 716px; background-image: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%)">
<div style="max-width: 672px; margin: 0 auto">
<div style="margin-bottom: 32px; padding: 16px; border: 1px solid #e5e5e5; border-radius: 14px; background: #ffffff; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06)">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px">
<div style="display: flex; gap: 4px">
<a href="Topic.dc.html" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px 0 6px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #0f172a; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Стоп</a>
<button type="button" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px 0 6px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 13px; font-weight: 500; color: #0f172a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>Показать правила</button>
</div>
<span style="font-size: 14px; font-weight: 500; color: #737373; font-variant-numeric: tabular-nums">3 / 10</span>
</div>
<div style="height: 8px; border-radius: 999px; background: rgba(15, 23, 42, 0.1)"><div style="width: 30%; height: 8px; border-radius: 999px; background: #0f172a"></div></div>
</div>
<div style="padding: 40px; border-radius: 18px; background: #ffffff; box-shadow: {{ ring }}">
<div style="margin-bottom: 32px; text-align: center">
<p style="margin: 0 0 24px; font-size: 16px; color: #737373">Введите множественное число слова:</p>
<p style="margin: 0 0 8px; font-size: 36px; font-weight: 700">grad</p>
<p style="margin: 0; font-size: 14px; color: #737373">(город)</p>
</div>
<div style="display: flex; gap: 12px; margin-bottom: 16px">
<label for="answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Ответ</label>
<input id="answer" type="text" placeholder="Введите множественное число..." style="flex: 1 1 auto; min-width: 0; height: 56px; box-sizing: border-box; padding: 0 20px; border: 0; border-radius: 999px; background: #f5f5f5; font: inherit; font-size: 18px; color: #0f172a">
<button type="button" aria-label="Подсказка" title="Подсказка" style="display: flex; align-items: center; justify-content: center; flex: 0 0 56px; height: 56px; border: 1px solid #e5e5e5; border-radius: 10px; background: #ffffff; color: #0f172a"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></button>
</div>
<div style="display: flex; align-items: center; justify-content: center; min-height: 64px; margin-bottom: 16px">
<sc-if value="{{ checked }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px; color: #16a34a"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span style="font-size: 18px; font-weight: 600">Правильно!</span></div>
</sc-if>
</div>
<sc-if value="{{ notChecked }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ check }}" style="width: 100%; height: 56px; border: 0; border-radius: 10px; background: #0f172a; font: inherit; font-size: 16px; font-weight: 600; color: #ffffff">Проверить</button>
</sc-if>
<sc-if value="{{ checked }}" hint-placeholder-val="{{ false }}">
<a href="SessionResults.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 10px; background: #0f172a; font-size: 16px; font-weight: 600; color: #ffffff; text-decoration: none">Далее</a>
</sc-if>
</div>
</div>
</main>
<dc-import name="Footer" hint-size="100%,200px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { checked: false };
}
renderVals() {
const checked = this.state.checked;
return {
checked: checked,
notChecked: !checked,
ring: checked ? '0 0 0 3px #16a34a, 0 4px 24px rgba(0,0,0,0.06)' : '0 4px 24px rgba(0,0,0,0.10)',
check: () => this.setState({ checked: true })
};
}
}
</script>
</body>
</html>
