<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход — CroGrammar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563eb}a:hover{color:#1d4ed8}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 1020px; background: #ffffff; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #0f172a">
<dc-import name="Header" variant="guest" hint-size="100%,64px"></dc-import>
<main style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 756px; box-sizing: border-box; padding: 16px; background-image: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%)">
<div style="margin-bottom: 32px; text-align: center">
<div style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 16px; background: #2563eb">
<span style="font-size: 26px; line-height: 1; font-weight: 700; color: #ffffff">C</span>
</div>
<h1 style="margin: 0 0 4px; font-size: 24px; font-weight: 700; color: #0f172a">CroGrammar</h1>
<p style="margin: 0 auto; max-width: 420px; font-size: 14px; color: #737373">Учите хорватский по-умному</p>
</div>
<div style="width: 100%; max-width: 420px; box-sizing: border-box; padding: 32px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 14px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06)">
<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
<h2 style="margin: 0 0 4px; text-align: center; font-size: 18px; font-weight: 600">С возвращением</h2>
<p style="margin: 0 0 24px; text-align: center; font-size: 14px; color: #737373">Войдите, чтобы продолжить обучение</p>
</sc-if>
<sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
<h2 style="margin: 0 0 4px; text-align: center; font-size: 18px; font-weight: 600">Создать аккаунт</h2>
<p style="margin: 0 0 24px; text-align: center; font-size: 14px; color: #737373">Начните учить хорватский сегодня</p>
</sc-if>
<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; box-sizing: border-box; border: 1px solid #e5e5e5; border-radius: 10px; background: #ffffff; font-size: 14px; font-weight: 500; color: #0f172a; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Войти через Google</a>
<div style="display: flex; align-items: center; gap: 12px; margin: 20px 0; font-size: 12px; color: #737373">
<div style="flex: 1 1 auto; height: 1px; background: #e5e5e5"></div>
или
<div style="flex: 1 1 auto; height: 1px; background: #e5e5e5"></div>
</div>
<sc-if value="{{ hideEmail }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ showEmail }}" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 40px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #0f172a">Продолжить с email</button>
</sc-if>
<sc-if value="{{ emailOpen }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="name" style="font-size: 14px; font-weight: 500">Имя</label>
<input id="name" type="text" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #e5e5e5; border-radius: 10px; font: inherit; font-size: 14px">
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 14px; font-weight: 500">Электронная почта</label>
<input id="email" type="email" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #e5e5e5; border-radius: 10px; font: inherit; font-size: 14px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="password" style="font-size: 14px; font-weight: 500">Пароль</label>
<input id="password" type="password" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #e5e5e5; border-radius: 10px; font: inherit; font-size: 14px">
</div>
<a href="{{ submitHref }}" style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 10px; background: #2563eb; font-size: 14px; font-weight: 500; color: #ffffff; text-decoration: none">{{ submitLabel }}</a>
</div>
</sc-if>
<div style="margin-top: 16px; text-align: center">
<button type="button" onClick="{{ toggleMode }}" style="border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 500; color: #2563eb">{{ toggleLabel }}</button>
</div>
</div>
</main>
<dc-import name="Footer" hint-size="100%,200px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1020}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mode: 'login', emailOpen: false };
}
renderVals() {
const isLogin = this.state.mode === 'login';
return {
isLogin: isLogin,
isRegister: !isLogin,
emailOpen: this.state.emailOpen,
hideEmail: !this.state.emailOpen,
submitLabel: isLogin ? 'Войти' : 'Зарегистрироваться',
submitHref: isLogin ? 'Home.dc.html' : 'LanguageSelect.dc.html',
toggleLabel: isLogin ? 'Нет аккаунта? Зарегистрируйтесь' : 'Уже есть аккаунт? Войдите',
showEmail: () => this.setState({ emailOpen: true }),
toggleMode: () => this.setState({ mode: isLogin ? 'register' : 'login' })
};
}
}
</script>
</body>
</html>
