<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход — вариант «Ночь в Дубровнике»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #C8A76A;outline-offset:3px}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 960px; background: #121B2A; font-family: 'Karla', ui-sans-serif, system-ui, sans-serif; color: #ECE6DA">
<dc-import name="NocHeader" variant="guest" hint-size="100%,76px"></dc-import>
<main style="flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 80px; padding: 72px 48px 88px">
<div aria-hidden="true" style="flex: 0 1 420px; display: flex; flex-direction: column; justify-content: flex-end; height: 600px; box-sizing: border-box; padding: 56px 48px; border: 1px solid #C8A76A; border-radius: 210px 210px 4px 4px; background: #18233A">
<p lang="hr" style="margin: 0 0 18px; font-family: 'Marcellus', Georgia, serif; font-size: 52px; line-height: 1.1; color: #ECE6DA">Tko rano rani, dvije sreće grabi.</p>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #A3A9B5">Кто рано встаёт, тому двойное счастье — хорватская пословица</p>
</div>
<div style="flex: 0 1 400px">
<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
<h1 style="margin: 0 0 10px; font-family: 'Marcellus', Georgia, serif; font-size: 44px; line-height: 1.1; font-weight: 400">С возвращением</h1>
<p style="margin: 0 0 40px; font-size: 16px; color: #A3A9B5">Войдите, чтобы продолжить обучение</p>
</sc-if>
<sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
<h1 style="margin: 0 0 10px; font-family: 'Marcellus', Georgia, serif; font-size: 44px; line-height: 1.1; font-weight: 400">Создать аккаунт</h1>
<p style="margin: 0 0 40px; font-size: 16px; color: #A3A9B5">Начните учить хорватский сегодня</p>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 18px">
<sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 500; color: #A3A9B5">Имя<input type="text" autocomplete="name" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #2A3753; border-radius: 10px; background: #18233A; font: inherit; font-size: 16px; color: #ECE6DA"></label>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 500; color: #A3A9B5">Электронная почта<input type="email" autocomplete="email" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #2A3753; border-radius: 10px; background: #18233A; font: inherit; font-size: 16px; color: #ECE6DA"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 500; color: #A3A9B5">Пароль<input type="password" autocomplete="current-password" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #2A3753; border-radius: 10px; background: #18233A; font: inherit; font-size: 16px; color: #ECE6DA"></label>
<a href="{{ submitHref }}" style="display: flex; align-items: center; justify-content: center; height: 52px; margin-top: 10px; border-radius: 10px; background: #C8A76A; font-size: 15px; font-weight: 600; color: #1A1408; text-decoration: none">{{ submitLabel }}</a>
<a href="NocHome.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; box-sizing: border-box; border: 1px solid #2A3753; border-radius: 10px; font-size: 15px; font-weight: 500; color: #ECE6DA; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.570-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.970 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Войти через Google</a>
</div>
<p style="margin: 28px 0 0; font-size: 14px; color: #A3A9B5">{{ togglePrompt }} <button type="button" onClick="{{ toggleMode }}" style="padding: 0; border: 0; background: transparent; font: inherit; font-weight: 600; color: #D9BC84; text-decoration: underline; text-underline-offset: 4px">{{ toggleLabel }}</button></p>
</div>
</main>
<dc-import name="NocFooter" hint-size="100%,140px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 'login' }; }
renderVals() {
const isLogin = this.state.mode === 'login';
return {
isLogin: isLogin, isRegister: !isLogin,
submitLabel: isLogin ? 'Войти' : 'Зарегистрироваться',
submitHref: isLogin ? 'NocHome.dc.html' : 'NocLanguage.dc.html',
togglePrompt: isLogin ? 'Нет аккаунта?' : 'Уже есть аккаунт?',
toggleLabel: isLogin ? 'Зарегистрируйтесь' : 'Войдите',
toggleMode: () => this.setState({ mode: isLogin ? 'register' : 'login' })
};
}
}
</script>
</body>
</html>
