<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сессия упражнения — редизайн</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D5C68}a:hover{color:#164A54}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #1D5C68;outline-offset:2px}
input::placeholder{color:#9AA4A6}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 1000px; background: #F6F7F4; font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; color: #1C2B30">
<dc-import name="LuxHeader" variant="auth" active="exercises" hint-size="100%,72px"></dc-import>
<main style="flex: 1 1 auto; min-height: 768px">
<div style="max-width: 720px; margin: 0 auto; box-sizing: border-box; padding: 48px 40px 88px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px">
<div style="display: flex; align-items: center; gap: 24px">
<a href="LuxTopic.dc.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: #5F6C6F; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Завершить</a>
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #5F6C6F"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>Правила</button>
</div>
<span style="font-size: 14px; color: #5F6C6F; font-variant-numeric: tabular-nums"><span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 600; color: #1C2B30">3</span> из 10</span>
</div>
<div role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="3" aria-label="Прогресс сессии" style="height: 2px; margin-bottom: 40px; background: #E2E6E1"><div style="width: 30%; height: 2px; background: #1D5C68"></div></div>
<section style="box-sizing: border-box; padding: 56px 56px 48px; border: {{ cardBorder }}; border-radius: 28px; background: #FFFFFF; text-align: center">
<p style="margin: 0 0 28px; font-size: 15px; color: #5F6C6F">Введите множественное число слова</p>
<p lang="hr" style="margin: 0 0 6px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 80px; line-height: 1; font-weight: 500">grad</p>
<p style="margin: 0 0 44px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; font-style: italic; color: #5F6C6F">город</p>
<div style="display: flex; gap: 12px; margin-bottom: 20px">
<label for="answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Ответ</label>
<input id="answer" lang="hr" type="text" placeholder="Ваш ответ" value="{{ input }}" onChange="{{ onInput }}" disabled="{{ checked }}" style="flex: 1 1 auto; min-width: 0; height: 60px; box-sizing: border-box; padding: 0 24px; border: 1px solid {{ inputBorder }}; border-radius: 999px; background: {{ inputBg }}; font: inherit; font-size: 19px; text-align: center; color: {{ inputColor }}; text-decoration: {{ inputDecoration }}">
<button type="button" aria-label="Подсказка: следующая буква" title="Подсказка" onClick="{{ hint }}" style="display: flex; align-items: center; justify-content: center; flex: 0 0 60px; height: 60px; border: 1px solid #D5DBD6; border-radius: 999px; background: #FFFFFF; color: #7E6236; visibility: {{ hintVisibility }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></button>
</div>
<div style="min-height: 96px; margin-bottom: 20px">
<sc-if value="{{ isCorrect }}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: #1D5C68"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Правильно</span>
<span lang="hr" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-style: italic; color: #5F6C6F">Točno!</span>
</div>
</sc-if>
<sc-if value="{{ isIncorrect }}" hint-placeholder-val="{{ false }}">
<div role="alert" style="padding: 20px 24px; border-radius: 18px; background: #F6ECE9; text-align: center">
<p style="margin: 0 0 4px; font-size: 14px; font-weight: 600; color: #8C3B2E">Не совсем. Правильный ответ</p>
<p lang="hr" style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; line-height: 1.15; font-weight: 600; color: #1C2B30">gradovi</p>
</div>
</sc-if>
</div>
<sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ check }}" disabled="{{ empty }}" style="width: 100%; height: 56px; border: 0; border-radius: 999px; background: {{ checkBg }}; font: inherit; font-size: 15px; font-weight: 600; color: {{ checkColor }}">Проверить</button>
</sc-if>
<sc-if value="{{ isIncorrect }}" hint-placeholder-val="{{ false }}">
<a href="LuxSessionResults.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #1C2B30; font-size: 15px; font-weight: 600; color: #FFFFFF; text-decoration: none">Далее</a>
</sc-if>
<sc-if value="{{ isCorrect }}" hint-placeholder-val="{{ false }}">
<a href="LuxSessionResults.dc.html" style="display: block; font-size: 13px; color: #5F6C6F; text-decoration: none">Следующий вопрос откроется автоматически</a>
</sc-if>
</section>
</div>
</main>
<dc-import name="LuxFooter" hint-size="100%,160px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"initialState":{"editor":"enum","options":["idle","correct","incorrect"],"default":"idle"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const init = props.initialState ?? 'idle';
this.state = { status: init, input: init === 'correct' ? 'gradovi' : (init === 'incorrect' ? 'gradi' : ''), hintUsed: false };
}
renderVals() {
const self = this;
const answer = 'gradovi';
const status = this.state.status;
const input = this.state.input;
const checked = status !== 'idle';
const empty = input.trim() === '';
const evaluate = function (value, hintUsed) {
const ok = !hintUsed && value.trim().toLowerCase() === answer;
self.setState({ status: ok ? 'correct' : 'incorrect' });
};
return {
input: input, checked: checked, empty: empty,
isIdle: status === 'idle', isCorrect: status === 'correct', isIncorrect: status === 'incorrect',
cardBorder: status === 'correct' ? '1.5px solid #1D5C68' : '1px solid #E2E6E1',
inputBorder: status === 'correct' ? '#1D5C68' : (status === 'incorrect' ? '#E3C7C0' : '#D5DBD6'),
inputBg: status === 'correct' ? '#EEF4F3' : (status === 'incorrect' ? '#FBF6F4' : '#FFFFFF'),
inputColor: status === 'incorrect' ? '#8C3B2E' : '#1C2B30',
inputDecoration: status === 'incorrect' ? 'line-through' : 'none',
hintVisibility: checked ? 'hidden' : 'visible',
checkBg: empty ? '#E2E6E1' : '#1D5C68',
checkColor: empty ? '#8C979A' : '#FFFFFF',
onInput: function (e) {
const value = e.target.value;
self.setState({ input: value });
if (value.trim().toLowerCase() === answer && !self.state.hintUsed) self.setState({ input: value, status: 'correct' });
},
hint: function () {
if (checked) return;
let n = 0;
while (n < input.length && n < answer.length && input[n].toLowerCase() === answer[n]) n++;
const next = answer.slice(0, n + 1);
self.setState({ input: next, hintUsed: true });
if (next === answer) evaluate(next, true);
},
check: function () { if (!empty) evaluate(input, self.state.hintUsed); }
};
}
}
</script>
</body>
</html>
