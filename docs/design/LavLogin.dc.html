<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход — вариант «Лаванда»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
input:focus-visible,button:focus-visible,a:focus-visible{outline:1px solid #4E3F7A;outline-offset:3px}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 980px; background: #F5F3F8; font-family: 'Jost', ui-sans-serif, system-ui, sans-serif; color: #251E33">
<dc-import name="LavHeader" variant="guest" hint-size="100%,80px"></dc-import>
<main style="flex: 1 1 auto; display: flex; justify-content: center; padding: 88px 24px 96px">
<div style="width: 100%; max-width: 420px; text-align: center">
<svg width="120" height="44" viewBox="0 0 120 44" aria-hidden="true" style="display: block; margin: 0 auto 32px"><path d="M60 42 C 60 30, 58 18, 52 6" fill="none" stroke="#8A6F43" stroke-width="1"/><g fill="#9B8BC4"><ellipse cx="52" cy="6" rx="2.2" ry="3.4"/><ellipse cx="55" cy="12" rx="2.2" ry="3.4" transform="rotate(25 55 12)"/><ellipse cx="50" cy="13" rx="2.2" ry="3.4" transform="rotate(-25 50 13)"/><ellipse cx="57" cy="19" rx="2.2" ry="3.4" transform="rotate(25 57 19)"/><ellipse cx="52.5" cy="20" rx="2.2" ry="3.4" transform="rotate(-25 52.5 20)"/></g><path d="M0 42 H 120" stroke="#E4DFEB" stroke-width="1"/></svg>
<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
<h1 lang="hr" style="margin: 0 0 12px; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 56px; line-height: 1.05; font-weight: 400; font-style: italic">Dobrodošli natrag</h1>
<p style="margin: 0 0 48px; font-size: 16px; font-weight: 300; color: #6B6478">С возвращением — войдите, чтобы продолжить</p>
</sc-if>
<sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
<h1 lang="hr" style="margin: 0 0 12px; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-size: 56px; line-height: 1.05; font-weight: 400; font-style: italic">Prvi korak</h1>
<p style="margin: 0 0 48px; font-size: 16px; font-weight: 300; color: #6B6478">Первый шаг — создайте аккаунт</p>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 28px; text-align: left">
<sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6B6478">Имя<input type="text" autocomplete="name" style="height: 44px; padding: 0; border: 0; border-bottom: 1px solid #CFC7DB; background: transparent; font: inherit; font-size: 17px; color: #251E33"></label>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6B6478">Электронная почта<input type="email" autocomplete="email" style="height: 44px; padding: 0; border: 0; border-bottom: 1px solid #CFC7DB; background: transparent; font: inherit; font-size: 17px; color: #251E33"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6B6478">Пароль<input type="password" autocomplete="current-password" style="height: 44px; padding: 0; border: 0; border-bottom: 1px solid #CFC7DB; background: transparent; font: inherit; font-size: 17px; color: #251E33"></label>
</div>
<a href="{{ submitHref }}" style="display: flex; align-items: center; justify-content: center; height: 54px; margin-top: 44px; border-radius: 2px; background: #4E3F7A; font-size: 15px; font-weight: 500; letter-spacing: 0.02em; color: #FFFFFF; text-decoration: none">{{ submitLabel }}</a>
<a href="LavHome.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; margin-top: 12px; box-sizing: border-box; border: 1px solid #CFC7DB; border-radius: 2px; font-size: 15px; color: #251E33; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Продолжить с Google</a>
<p style="margin: 36px 0 0; font-size: 14px; font-weight: 300; color: #6B6478">{{ togglePrompt }} <button type="button" onClick="{{ toggleMode }}" style="padding: 0; border: 0; background: transparent; font: inherit; font-weight: 500; color: #4E3F7A; text-decoration: underline; text-underline-offset: 4px">{{ toggleLabel }}</button></p>
</div>
</main>
<dc-import name="LavFooter" hint-size="100%,180px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 'login' }; }
renderVals() {
const isLogin = this.state.mode === 'login';
return {
isLogin: isLogin, isRegister: !isLogin,
submitLabel: isLogin ? 'Войти' : 'Зарегистрироваться',
submitHref: isLogin ? 'LavHome.dc.html' : 'LavLanguage.dc.html',
togglePrompt: isLogin ? 'Нет аккаунта?' : 'Уже есть аккаунт?',
toggleLabel: isLogin ? 'Зарегистрируйтесь' : 'Войдите',
toggleMode: () => this.setState({ mode: isLogin ? 'register' : 'login' })
};
}
}
</script>
</body>
</html>
