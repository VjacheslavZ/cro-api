<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Повторение слов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563eb}a:hover{color:#1d4ed8}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 864px; background: #ffffff; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #0f172a">
<dc-import name="Header" variant="auth" hint-size="100%,64px"></dc-import>
<main style="flex: 1 1 auto; min-height: 600px">
<div style="max-width: 600px; margin: 0 auto; box-sizing: border-box; padding: 32px 24px">
<div style="display: flex; align-items: center; gap: 16px; margin-bottom: 16px">
<div style="flex: 1 1 auto; height: 8px; border-radius: 999px; background: #e5e5e5"><div style="width: 25%; height: 8px; border-radius: 999px; background: #2563eb"></div></div>
<a href="Vocabulary.dc.html" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px 0 6px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #0f172a; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>Стоп</a>
</div>
<h2 style="margin: 0 0 4px; font-size: 18px; font-weight: 500">Повторение</h2>
<p style="margin: 0 0 16px; font-size: 14px; color: #737373">Насколько легко вспомнили?</p>
<button type="button" onClick="{{ reveal }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 200px; margin-bottom: 24px; padding: 24px; box-sizing: border-box; border: 1px solid #e5e5e5; border-radius: 14px; background: #ffffff; font: inherit; color: #0f172a; text-align: center">
<span style="font-size: 30px; font-weight: 600">mačka</span>
<sc-if value="{{ hidden }}" hint-placeholder-val="{{ true }}">
<span style="margin-top: 16px; font-size: 14px; color: #737373">Нажмите, чтобы увидеть перевод</span>
</sc-if>
<sc-if value="{{ revealed }}" hint-placeholder-val="{{ false }}">
<span style="margin-top: 16px; font-size: 24px; color: #2563eb">кошка</span>
</sc-if>
</button>
<sc-if value="{{ revealed }}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<a href="DictReviewResults.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; border-radius: 10px; background: #dc2626; color: #ffffff; text-decoration: none"><span style="font-size: 14px; font-weight: 600; text-transform: uppercase">Снова</span><span style="font-size: 12px; opacity: 0.85">&lt; 1 мин</span></a>
<a href="DictReviewResults.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; border-radius: 10px; background: #b45309; color: #ffffff; text-decoration: none"><span style="font-size: 14px; font-weight: 600; text-transform: uppercase">Трудно</span><span style="font-size: 12px; opacity: 0.85">[N] дн.</span></a>
<a href="DictReviewResults.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; border-radius: 10px; background: #2563eb; color: #ffffff; text-decoration: none"><span style="font-size: 14px; font-weight: 600; text-transform: uppercase">Хорошо</span><span style="font-size: 12px; opacity: 0.85">[N] дн.</span></a>
<a href="DictReviewResults.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; border-radius: 10px; background: #15803d; color: #ffffff; text-decoration: none"><span style="font-size: 14px; font-weight: 600; text-transform: uppercase">Легко</span><span style="font-size: 12px; opacity: 0.85">[N] дн.</span></a>
</div>
</sc-if>
</div>
</main>
<dc-import name="Footer" hint-size="100%,200px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":864}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { revealed: false };
}
renderVals() {
const r = this.state.revealed;
return { revealed: r, hidden: !r, reveal: () => this.setState({ revealed: true }) };
}
}
</script>
</body>
</html>
