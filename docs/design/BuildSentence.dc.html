<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Составить предложение</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563eb}a:hover{color:#1d4ed8}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 940px; background: #ffffff; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #0f172a">
<dc-import name="Header" variant="auth" hint-size="100%,64px"></dc-import>
<main style="flex: 1 1 auto; box-sizing: border-box; padding: 48px 16px; min-height: 676px; background-image: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%)">
<div style="max-width: 672px; margin: 0 auto">
<div style="margin-bottom: 32px; padding: 16px; border: 1px solid #e5e5e5; border-radius: 14px; background: #ffffff; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06)">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px">
<div style="display: flex; gap: 4px">
<a href="Topic.dc.html" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px 0 6px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #0f172a; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Стоп</a>
<button type="button" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px 0 6px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 13px; font-weight: 500; color: #0f172a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>Показать правила</button>
</div>
<span style="font-size: 14px; font-weight: 500; color: #737373; font-variant-numeric: tabular-nums">2 / 8</span>
</div>
<div style="height: 8px; border-radius: 999px; background: rgba(15, 23, 42, 0.1)"><div style="width: 25%; height: 8px; border-radius: 999px; background: #0f172a"></div></div>
</div>
<div style="padding: 24px; border-radius: 14px; background: #ffffff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 0 0 1px rgba(15,23,42,0.1)">
<p style="margin: 0 0 4px; font-size: 14px; color: #737373">Составьте хорватское предложение:</p>
<p style="margin: 0 0 24px; font-size: 18px; font-weight: 500">Я ем хлеб</p>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; min-height: 40px; margin-bottom: 16px; padding: 12px; box-sizing: border-box; border: 1px dashed #d4d4d4; border-radius: 10px; background: rgba(245,245,245,0.5)">
<sc-if value="{{ selecting }}" hint-placeholder-val="{{ true }}">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="1">
<span style="display: inline-flex; align-items: center; gap: 2px; height: 24px; padding: 0 8px; box-sizing: border-box; border: 1px solid #e5e5e5; border-radius: 999px; background: #eff6ff; font-size: 14px; font-weight: 500">{{ c.word }}<sc-if value="{{ c.last }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Отменить" onClick="{{ undo }}" style="display: inline-flex; align-items: center; justify-content: center; margin: 0 -4px 0 2px; padding: 2px; border: 0; border-radius: 999px; background: transparent; color: #0f172a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></sc-if></span>
</sc-for>
</sc-if>
<sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
<sc-for list="{{ results }}" as="r" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center">
<sc-if value="{{ r.wrong }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; line-height: 1.25; font-weight: 600; color: #15803d">{{ r.correct }}</span></sc-if>
<span style="display: inline-flex; align-items: center; height: 24px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: {{ r.bg }}; font-size: 14px; font-weight: 500; color: {{ r.color }}; text-decoration: {{ r.decoration }}">{{ r.chosen }}</span>
</div>
</sc-for>
</sc-if>
</div>
<sc-if value="{{ selecting }}" hint-placeholder-val="{{ true }}">
<p style="margin: 0 0 8px; font-size: 12px; color: #737373">{{ wordOf }}</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ options }}" as="o" hint-placeholder-count="6">
<button type="button" onClick="{{ o.pick }}" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; box-sizing: border-box; border: 1px solid #e5e5e5; border-radius: 10px; background: #ffffff; font: inherit; font-size: 18px; font-weight: 500; text-transform: lowercase; color: #0f172a"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 1px solid currentColor; border-radius: 3px; font-size: 10px; line-height: 1; opacity: 0.55">{{ o.n }}</span>{{ o.label }}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ isCorrect }}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: flex-start; gap: 10px; margin-top: 8px; padding: 10px 14px; border: 1px solid #16a34a; border-radius: 10px; background: #ffffff; font-size: 14px; font-weight: 500; color: #166534"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px; margin-top: 2px"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span>Правильно!</span></div>
<a href="BuildSentenceResults.dc.html" style="display: block; margin-top: 16px; text-align: center; font-size: 13px; color: #525252; text-decoration: none">Автопереход к следующему предложению…</a>
</sc-if>
<sc-if value="{{ isIncorrect }}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; align-items: flex-start; gap: 10px; margin: 8px 0 16px; padding: 10px 14px; border: 1px solid #e5e5e5; border-radius: 10px; background: #ffffff; font-size: 14px; color: #dc2626"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px; margin-top: 2px"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg><div><div style="font-weight: 500">Почти! Вот правильное предложение:</div><div style="margin-top: 2px; font-weight: 600; color: #b91c1c">Ja jedem kruh</div></div></div>
<button type="button" onClick="{{ retry }}" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; margin-top: 8px; padding: 0 12px 0 10px; border: 0; border-radius: 8px; background: #2563eb; font: inherit; font-size: 14px; font-weight: 500; color: #ffffff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Попробовать снова</button>
</sc-if>
</div>
</div>
</main>
<dc-import name="Footer" hint-size="100%,200px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"initialState":{"editor":"enum","options":["selecting","correct","incorrect"],"default":"selecting"},"$preview":{"width":1440,"height":940}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.words = [
{ word: 'Ja', options: ['Ti', 'Ja', 'On', 'Mi', 'Vi', 'Oni'] },
{ word: 'jedem', options: ['jedeš', 'jede', 'jedem', 'jedemo', 'jedete', 'jedu'] },
{ word: 'kruh', options: ['mlijeko', 'kruh', 'vodu', 'jabuku', 'sir', 'meso'] }
];
const init = props.initialState ?? 'selecting';
const selected = init === 'correct' ? ['Ja', 'jedem', 'kruh'] : (init === 'incorrect' ? ['Ti', 'jedem', 'vodu'] : ['Ja']);
this.state = { selected: selected, phase: init };
}
renderVals() {
const self = this;
const words = this.words;
const sel = this.state.selected;
const phase = this.state.phase;
const idx = sel.length;
const choose = function (opt) {
if (self.state.phase !== 'selecting') return;
const next = self.state.selected.concat([opt]);
if (next.length < words.length) { self.setState({ selected: next }); return; }
const ok = next.every(function (w, i) { return w === words[i].word; });
self.setState({ selected: next, phase: ok ? 'correct' : 'incorrect' });
};
const current = words[Math.min(idx, words.length - 1)];
return {
selecting: phase === 'selecting',
finished: phase !== 'selecting',
isCorrect: phase === 'correct',
isIncorrect: phase === 'incorrect',
chips: sel.map(function (w, i) { return { word: w, last: i === sel.length - 1 }; }),
results: words.map(function (w, i) {
const chosen = sel[i];
const wrong = chosen !== w.word;
return { chosen: chosen, correct: w.word, wrong: wrong, bg: wrong ? '#fee2e2' : '#dcfce7', color: wrong ? '#991b1b' : '#166534', decoration: wrong ? 'line-through' : 'none' };
}),
wordOf: 'Слово ' + (idx + 1) + ' из ' + words.length,
options: current.options.map(function (o, i) { return { label: o, n: i + 1, pick: function () { choose(o); } }; }),
undo: function () { if (self.state.phase === 'selecting') self.setState({ selected: self.state.selected.slice(0, -1) }); },
retry: function () { self.setState({ selected: [], phase: 'selecting' }); }
};
}
}
</script>
</body>
</html>
