<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выбор языка — редизайн</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D5C68}a:hover{color:#164A54}
button:focus-visible,a:focus-visible{outline:2px solid #1D5C68;outline-offset:2px}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 960px; background: #F6F7F4; font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; color: #1C2B30">
<dc-import name="LuxHeader" variant="auth" hint-size="100%,72px"></dc-import>
<main style="flex: 1 1 auto; min-height: 728px">
<div style="max-width: 1080px; margin: 0 auto; box-sizing: border-box; padding: 88px 40px 72px">
<h1 lang="hr" style="margin: 0 0 12px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 64px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em">Odaberite jezik</h1>
<p style="margin: 0 0 8px; font-size: 20px; font-weight: 500">Выберите ваш родной язык</p>
<p style="margin: 0 0 56px; max-width: 520px; font-size: 15px; line-height: 1.6; color: #5F6C6F">На нём будут переводы и объяснения правил. Изменить язык можно позже в настройках.</p>
<div role="radiogroup" aria-label="Родной язык" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 72px">
<sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ l.checked }}" onClick="{{ l.pick }}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 180px; padding: 28px; box-sizing: border-box; border: {{ l.border }}; border-radius: 20px; background: {{ l.bg }}; font: inherit; text-align: left; color: #1C2B30">
<span style="display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: auto">
<span style="font-size: 13px; color: #5F6C6F">{{ l.english }}</span>
<span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; box-sizing: border-box; border: 1px solid {{ l.dotBorder }}; border-radius: 999px; background: {{ l.dotBg }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="visibility: {{ l.checkVisibility }}"><path d="M20 6 9 17l-5-5"/></svg></span>
</span>
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 40px; line-height: 1.1; font-weight: 500">{{ l.name }}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; padding-top: 32px; border-top: 1px solid #E2E6E1">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<span style="font-size: 14px; color: #5F6C6F">Оформление</span>
<div role="radiogroup" aria-label="Оформление" style="display: inline-flex; padding: 4px; border-radius: 999px; background: #EBEEEA">
<sc-for list="{{ themes }}" as="t" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ t.checked }}" onClick="{{ t.pick }}" style="height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: {{ t.bg }}; box-shadow: {{ t.shadow }}; font: inherit; font-size: 13px; font-weight: 500; color: #1C2B30">{{ t.label }}</button>
</sc-for>
</div>
</div>
<a href="LuxHome.dc.html" style="display: inline-flex; align-items: center; justify-content: center; height: 52px; padding: 0 32px; border-radius: 999px; background: #1D5C68; font-size: 15px; font-weight: 600; color: #FFFFFF; text-decoration: none">Продолжить</a>
</div>
</div>
</main>
<dc-import name="LuxFooter" hint-size="100%,160px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { lang: 'RU', theme: 'SYSTEM' };
}
renderVals() {
const self = this;
const langs = [['UK', 'Українська', 'Ukrainian'], ['EN', 'English', 'English'], ['RU', 'Русский', 'Russian']].map(function (d) {
const on = self.state.lang === d[0];
return {
name: d[1], english: d[2], checked: on ? 'true' : 'false',
border: on ? '1.5px solid #1D5C68' : '1px solid #E2E6E1',
bg: on ? '#EEF4F3' : '#FFFFFF',
dotBorder: on ? '#1D5C68' : '#C9D0CB', dotBg: on ? '#1D5C68' : '#FFFFFF',
checkVisibility: on ? 'visible' : 'hidden',
pick: function () { self.setState({ lang: d[0] }); }
};
});
const themes = [['SYSTEM', 'Системная'], ['LIGHT', 'Светлая'], ['DARK', 'Тёмная']].map(function (d) {
const on = self.state.theme === d[0];
return { label: d[1], checked: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', shadow: on ? '0 1px 2px rgba(28,43,48,0.08)' : 'none', pick: function () { self.setState({ theme: d[0] }); } };
});
return { langs: langs, themes: themes };
}
}
</script>
</body>
</html>
