<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход — вариант «Бура»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #2443B5;outline-offset:2px}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 960px; background: #F3F5F9; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; color: #121826">
<header style="display: flex; align-items: center; justify-content: space-between; height: 80px; padding: 0 40px">
<span style="display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: #2443B5; box-shadow: inset -8px -8px 0 0 #6E86E0"></span>CroGrammar</span>
<span style="display: flex; gap: 8px">
<button type="button" aria-label="Тема" style="height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 14px; color: #121826">Светлая</button>
<button type="button" aria-label="Язык интерфейса" style="height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 14px; color: #121826">RU</button>
</span>
</header>
<main style="flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 64px; padding: 40px 40px 80px">
<div style="flex: 0 1 520px">
<p lang="hr" style="margin: 0 0 20px; font-size: 84px; line-height: 0.98; font-weight: 300; letter-spacing: -0.035em">Hrvatski,<br>korak po<br>korak.</p>
<p style="margin: 0; max-width: 400px; font-size: 18px; line-height: 1.6; color: #5B6475">Хорватский — шаг за шагом. Короткие упражнения, которые легко вписать в день.</p>
</div>
<div style="flex: 0 1 440px; box-sizing: border-box; padding: 44px; border-radius: 32px; background: #FFFFFF">
<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
<h1 style="margin: 0 0 32px; font-size: 32px; line-height: 1.15; font-weight: 400; letter-spacing: -0.02em">Вход</h1>
</sc-if>
<sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
<h1 style="margin: 0 0 32px; font-size: 32px; line-height: 1.15; font-weight: 400; letter-spacing: -0.02em">Регистрация</h1>
</sc-if>
<a href="BuraHome.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 16px; background: #F3F5F9; font-size: 15px; font-weight: 500; color: #121826; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Войти через Google</a>
<div style="display: flex; align-items: center; gap: 14px; margin: 24px 0; font-size: 13px; color: #5B6475"><span style="flex: 1 1 auto; height: 1px; background: #E6E9F0"></span>или<span style="flex: 1 1 auto; height: 1px; background: #E6E9F0"></span></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
<input type="text" aria-label="Имя" placeholder="Имя" autocomplete="name" style="height: 52px; box-sizing: border-box; padding: 0 18px; border: 1px solid #E6E9F0; border-radius: 16px; background: #FFFFFF; font: inherit; font-size: 16px; color: #121826">
</sc-if>
<input type="email" aria-label="Электронная почта" placeholder="Электронная почта" autocomplete="email" style="height: 52px; box-sizing: border-box; padding: 0 18px; border: 1px solid #E6E9F0; border-radius: 16px; background: #FFFFFF; font: inherit; font-size: 16px; color: #121826">
<input type="password" aria-label="Пароль" placeholder="Пароль" autocomplete="current-password" style="height: 52px; box-sizing: border-box; padding: 0 18px; border: 1px solid #E6E9F0; border-radius: 16px; background: #FFFFFF; font: inherit; font-size: 16px; color: #121826">
<a href="{{ submitHref }}" style="display: flex; align-items: center; justify-content: center; height: 52px; margin-top: 8px; border-radius: 16px; background: #2443B5; font-size: 15px; font-weight: 600; color: #FFFFFF; text-decoration: none">{{ submitLabel }}</a>
</div>
<p style="margin: 24px 0 0; text-align: center; font-size: 14px; color: #5B6475">{{ togglePrompt }} <button type="button" onClick="{{ toggleMode }}" style="padding: 0; border: 0; background: transparent; font: inherit; font-weight: 600; color: #2443B5">{{ toggleLabel }}</button></p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 'login' }; }
renderVals() {
const isLogin = this.state.mode === 'login';
return {
isLogin: isLogin, isRegister: !isLogin,
submitLabel: isLogin ? 'Войти' : 'Зарегистрироваться',
submitHref: isLogin ? 'BuraHome.dc.html' : 'BuraLanguage.dc.html',
togglePrompt: isLogin ? 'Нет аккаунта?' : 'Уже есть аккаунт?',
toggleLabel: isLogin ? 'Зарегистрируйтесь' : 'Войдите',
toggleMode: () => this.setState({ mode: isLogin ? 'register' : 'login' })
};
}
}
</script>
</body>
</html>
