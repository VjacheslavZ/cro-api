<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Header — вариант «Ночь в Дубровнике»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid #C8A76A;outline-offset:3px}
</style>
</helmet>
<header style="width: 100%; min-height: 76px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 0 48px; background: #121B2A; border-bottom: 1px solid #2A3753; font-family: 'Karla', ui-sans-serif, system-ui, sans-serif; color: #ECE6DA">
<div style="display: flex; align-items: center; gap: 48px; flex-wrap: wrap">
<a href="NocHome.dc.html" style="display: inline-flex; align-items: center; gap: 12px; font-family: 'Marcellus', Georgia, serif; font-size: 22px; letter-spacing: 0.06em; color: #ECE6DA; text-decoration: none"><svg width="20" height="24" viewBox="0 0 20 24" aria-hidden="true"><path d="M2 23 V10 a8 8 0 0 1 16 0 V23" fill="none" stroke="#C8A76A" stroke-width="1.4"/></svg>CroGrammar</a>
<sc-if value="{{ isAuth }}" hint-placeholder-val="{{ true }}">
<nav aria-label="Основная навигация" style="display: flex; gap: 32px; flex-wrap: wrap">
<a href="NocGrammar.dc.html" style="font-size: 15px; font-weight: 500; color: {{ exColor }}; text-decoration: none">Упражнения</a>
<a href="MyDictionary.dc.html" style="font-size: 15px; font-weight: 500; color: #A3A9B5; text-decoration: none">Словарь</a>
<a href="Lessons.dc.html" style="font-size: 15px; font-weight: 500; color: #A3A9B5; text-decoration: none">Уроки</a>
</nav>
</sc-if>
</div>
<div style="display: flex; align-items: center; gap: 20px">
<sc-if value="{{ isAuth }}" hint-placeholder-val="{{ true }}">
<span title="Всего XP" style="font-size: 14px; font-weight: 600; color: #D9BC84">[XP] XP</span>
<span title="Дней подряд" style="font-size: 14px; font-weight: 600; color: #D9BC84">[дни] дн.</span>
<button type="button" aria-label="Меню пользователя" style="width: 40px; height: 40px; border: 1px solid #C8A76A; border-radius: 999px; background: #18233A; font-family: 'Marcellus', Georgia, serif; font-size: 17px; color: #D9BC84">V</button>
</sc-if>
<sc-if value="{{ isGuest }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Тема" style="height: 36px; padding: 0 14px; border: 1px solid #2A3753; border-radius: 999px; background: transparent; font: inherit; font-size: 13px; color: #ECE6DA">Тёмная</button>
<button type="button" aria-label="Язык интерфейса" style="height: 36px; padding: 0 14px; border: 1px solid #2A3753; border-radius: 999px; background: transparent; font: inherit; font-size: 13px; color: #ECE6DA">RU</button>
</sc-if>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["auth","guest"],"default":"auth"},"active":{"editor":"enum","options":["none","exercises"],"default":"none"},"$preview":{"width":1440,"height":76}}'>
class Component extends DCLogic {
renderVals() {
const variant = this.props.variant ?? 'auth';
const active = this.props.active ?? 'none';
return { isAuth: variant !== 'guest', isGuest: variant === 'guest', exColor: active === 'exercises' ? '#D9BC84' : '#A3A9B5' };
}
}
</script>
</body>
</html>
