<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выбор языка — вариант «Бура»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button:focus-visible,a:focus-visible{outline:2px solid #2443B5;outline-offset:2px}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 960px; background: #FFFFFF; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; color: #121826">
<header style="display: flex; align-items: center; justify-content: space-between; height: 80px; padding: 0 40px">
<span style="display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: #2443B5; box-shadow: inset -8px -8px 0 0 #6E86E0"></span>CroGrammar</span>
</header>
<main style="flex: 1 1 auto; display: flex; justify-content: center; padding: 64px 40px 80px">
<div style="width: 100%; max-width: 640px">
<h1 lang="hr" style="margin: 0 0 16px; font-size: 72px; line-height: 1; font-weight: 300; letter-spacing: -0.035em">Koji je vaš jezik?</h1>
<p style="margin: 0 0 48px; font-size: 18px; line-height: 1.6; color: #5B6475">Какой ваш родной язык? На нём будут переводы и объяснения.</p>
<div role="radiogroup" aria-label="Родной язык" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 40px">
<sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ l.checked }}" onClick="{{ l.pick }}" style="display: flex; align-items: center; gap: 18px; height: 76px; padding: 0 24px; border: 0; border-radius: 22px; background: {{ l.bg }}; font: inherit; text-align: left; color: {{ l.color }}">
<span aria-hidden="true" style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 999px; border: {{ l.dot }}; background: #FFFFFF"></span>
<span style="flex: 1 1 auto; font-size: 24px; font-weight: 400; letter-spacing: -0.01em">{{ l.name }}</span>
<span style="font-size: 14px; opacity: 0.75">{{ l.english }}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px">
<div role="radiogroup" aria-label="Оформление" style="display: inline-flex; padding: 4px; border-radius: 999px; background: #F3F5F9">
<sc-for list="{{ themes }}" as="t" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ t.checked }}" onClick="{{ t.pick }}" style="height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: {{ t.bg }}; font: inherit; font-size: 14px; font-weight: 500; color: #121826">{{ t.label }}</button>
</sc-for>
</div>
<a href="BuraHome.dc.html" style="display: inline-flex; align-items: center; justify-content: center; height: 56px; padding: 0 36px; border-radius: 18px; background: #2443B5; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none">Продолжить</a>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { lang: 'RU', theme: 'SYSTEM' }; }
renderVals() {
const self = this;
const langs = [['UK', 'Українська', 'Ukrainian'], ['EN', 'English', 'English'], ['RU', 'Русский', 'Russian']].map(function (d) {
const on = self.state.lang === d[0];
return { name: d[1], english: d[2], checked: on ? 'true' : 'false', bg: on ? '#2443B5' : '#F3F5F9', color: on ? '#FFFFFF' : '#121826', dot: on ? '7px solid #FFFFFF' : '1.5px solid #C5CBD8', pick: function () { self.setState({ lang: d[0] }); } };
});
const themes = [['SYSTEM', 'Системная'], ['LIGHT', 'Светлая'], ['DARK', 'Тёмная']].map(function (d) {
const on = self.state.theme === d[0];
return { label: d[1], checked: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', pick: function () { self.setState({ theme: d[0] }); } };
});
return { langs: langs, themes: themes };
}
}
</script>
</body>
</html>
