<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Header — редизайн</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 100%; min-height: 72px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 0 40px; background: #F6F7F4; border-bottom: 1px solid #E2E6E1; font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; color: #1C2B30">
<a href="LuxHome.dc.html" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; font-weight: 600; letter-spacing: 0.01em; color: #1C2B30; text-decoration: none">CroGrammar</a>
<sc-if value="{{ isAuth }}" hint-placeholder-val="{{ true }}">
<nav aria-label="Основная навигация" style="display: flex; align-items: center; gap: 32px; flex-wrap: wrap">
<a href="LuxGrammar.dc.html" style="padding: 6px 0; border-bottom: 1px solid {{ exUnderline }}; font-size: 14px; font-weight: 500; color: #1C2B30; text-decoration: none">Упражнения</a>
<a href="MyDictionary.dc.html" style="padding: 6px 0; border-bottom: 1px solid transparent; font-size: 14px; font-weight: 500; color: #1C2B30; text-decoration: none">Словарь</a>
<a href="Lessons.dc.html" style="padding: 6px 0; border-bottom: 1px solid transparent; font-size: 14px; font-weight: 500; color: #1C2B30; text-decoration: none">Уроки</a>
</nav>
<div style="display: flex; align-items: center; gap: 20px">
<span title="Всего XP" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #7E6236"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9C7A45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>[XP]</span>
<span title="Дней подряд" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #7E6236"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9C7A45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>[дни]</span>
<button type="button" aria-label="Меню пользователя" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid #D5DBD6; border-radius: 999px; background: #FFFFFF; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; font-weight: 600; color: #1D5C68">V</button>
</div>
</sc-if>
<sc-if value="{{ isGuest }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Тема" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 0; border-radius: 999px; background: transparent; color: #1C2B30"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
<button type="button" aria-label="Язык интерфейса" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: #1C2B30">RU<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
</div>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["auth","guest"],"default":"auth"},"active":{"editor":"enum","options":["none","exercises"],"default":"none"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
renderVals() {
const variant = this.props.variant ?? 'auth';
const active = this.props.active ?? 'none';
return { isAuth: variant !== 'guest', isGuest: variant === 'guest', exUnderline: active === 'exercises' ? '#1C2B30' : 'transparent' };
}
}
</script>
</body>
</html>
